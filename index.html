<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Piece Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <img src="img\Background\background.jpg" alt="Background" class="site-background">

  <header class="navbar">
    <div class="nav-container">
      <div class="logo-area">
        <img src="img\Logo\LogoOnePiece.png" alt="One Piece Logo" class="logo-img">
      </div>
      
      <nav class="nav-links">
        <a href="#" class="nav-item">Home</a>
        
        <div class="dropdown">
          <button class="dropdown-btn">Start your journey</button>
          <div class="dropdown-content">
            <a href="alabasta.html">Alabasta</a>
            <a href="water 7.html">Water 7</a>
            <a href="sabaody.html">Saboady</a>
            <a href="marineford.html">Marineford</a>
            <a href="dressrosa.html">Dressrosa</a>
            <a href="zou.html">Zou</a>
            <a href="wholecake.html">Cake Island</a>
            <a href="wano.html">Wano Country</a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="content-wrapper">
    
    <div class="hero-banner">
      <h1>The sea is calling</h1>
    </div>

    <section class="cards-container">
      
      <div id="alabasta" class="island-card">
        <div class="card-text">
          <h2>Alabasta</h2>
        </div>
        <div class="card-image">
          <img src="img\Galery\download.jpg" alt="Alabasta Image">
        </div>
      </div>

      <div id="water7" class="island-card">
        <div class="card-text">
          <h2>Water 7</h2>
        </div>
        <div class="card-image">
          <img src="img\Galery\Water 7.jpg" alt="Water 7 Image">
        </div>
      </div>

      <div id="sabaody" class="island-card">
        <div class="card-text">
          <h2>Sabaody Archipelago</h2>
        </div>
        <div class="card-image">
          <img src="img\Galery\Sabaody architecture.jpg" alt="Sabaody Image">
        </div>
      </div>

      <div id="marineford" class="island-card">
        <div class="card-text">
          <h2>Marineford</h2>
        </div>
        <div class="card-image">
          <img src="img\Galery\Marine Ford.jpg" alt="Marineford Image">
        </div>
      </div>

      <div id="dressrosa" class="island-card">
        <div class="card-text">
          <h2>Dressrosa</h2>
        </div>
        <div class="card-image">
          <img src="img\Galery\dressrosa.jpg" alt="Dressrosa Image">
        </div>
      </div>

      <div id="zou" class="island-card">
        <div class="card-text">
          <h2>Zou</h2>
        </div>
        <div class="card-image">
          <img src="img\Galery\Zou Arc.jpg" alt="Zou Image">
        </div>
      </div>

      <div id="wholecake" class="island-card">
        <div class="card-text">
          <h2>Whole Cake Island</h2>
        </div>
        <div class="card-image">
          <img src="img\Galery\Whole Cake Island.jpg" alt="Whole Cake Island Image">
        </div>
      </div>

      <div id="wano" class="island-card">
        <div class="card-text">
          <h2>Wano Country</h2>
        </div>
        <div class="card-image">
          <img src="img\Galery\wano country.jpg" alt="Wano Country Image">
        </div>
      </div>

    </section>
  </main>

  <a href="#" class="footer-bar">
    <p>Start your journey</p>
  </a>

</body>
</html>
